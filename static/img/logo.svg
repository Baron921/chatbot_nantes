<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="gradNantes" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="gradAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="46" fill="url(#gradNantes)" />
  
  <!-- Subtle inner border -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Castle / Fortress crenellations (symbolizing Château des ducs) -->
  <path d="M 28 62 L 28 44 L 34 44 L 34 49 L 40 49 L 40 44 L 46 44 L 46 49 L 54 49 L 54 44 L 60 44 L 60 49 L 66 49 L 66 44 L 72 44 L 72 62 Z" fill="#ffffff" />
  
  <!-- Central Arch / Gate -->
  <path d="M 44 62 L 44 53 C 44 50 56 50 56 53 L 56 62 Z" fill="#0284c7" />

  <!-- Stylized River Loire waves below -->
  <path d="M 22 68 Q 36 63 50 68 T 78 68" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <path d="M 27 75 Q 38 71 50 75 T 73 75" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.8" />

  <!-- Sparks / Green travel star (Le Voyage à Nantes) -->
  <circle cx="50" cy="32" r="4.5" fill="#10b981" stroke="#ffffff" stroke-width="1.5" />
</svg>

